name: Dashboard browser smoke

# WHY THIS EXISTS
# ---------------
# Nine wallet defects were found in one session, and not one was caught by `tsc`,
# `npm test`, the build, or CI. Every one surfaced only in a real browser: a CSP
# that blocked a wallet's connect iframe, a service worker whose fetch handler
# threw, deploy/asset skew between a cached document and chunks the new build had
# deleted, a wallet handshake that only died once a real extension was involved.
# Those gates verify the server; they are structurally blind to the browser.
#
# This job runs a Playwright suite against the PR's ACTUAL Netlify deploy preview
# (not a local build), so the browser-facing surface is exercised on every PR.
#
# COVERAGE / NON-COVERAGE
#   Covered: page rendering and the Next global error shell, CSP violations,
#   console/page errors, chunk-reference integrity (asset skew), the
#   forgot-password enumeration property, the reset-page session guard, and the
#   wallet challenge API reached from the page.
#   NOT covered: the wallet SIGNATURE step. Driving the official wallet adapters
#   needs a real extension, which CI cannot install. That remains a manual
#   procedure.
#
# Deliberately NOT (yet) a required status check on `main`. Making it required is
# an owner decision, and it depends on a Netlify preview existing for every PR —
# including from forks, which do not receive previews.
#
# WHY THE JOB CAN NOW SKIP WITHOUT RUNNING (added 2026-10-27)
# Both Netlify sites skip their build when a deploy changes no ship-able files
# (see the `ignore` command in each netlify.toml), so a docs-only PR generates NO
# deploy preview. This job used to wait 20 minutes for one and then fail — a red X
# that said nothing about the code.
#
# The gate must be DIFF-BASED, not status-based, because Netlify reports a skipped
# build through the commit-status API as `failure: "Deploy Preview failed."` —
# byte-identical to a real build failure, and it reports a quota skip ("Skipped due
# to account builds usage exceeded") the same way. There is no string to match on,
# so the decision is made from the change set instead.
#
# The set is computed the same way Netlify computes it: the PR's base tip against
# its head, over `dashboard-app`, excluding `dashboard-app/docs`. When that is
# empty the suite simply does not apply, and the job is skipped (visibly, as a skip
# — not as a green pass).
#
# KNOWN LIMIT: if a branch changes app code and a LATER commit changes only docs,
# Netlify may skip the build for the head commit while this gate (which sees the
# whole PR diff) still expects a preview. That lands as a failure with the message
# below rather than a silent skip — run the suite explicitly with the
# `workflow_dispatch` `base_url` input in that case.

on:
  pull_request:
    branches:
      - main
      - "security/**"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Deployed URL to smoke-test. If set, skips the deploy-preview wait."
        required: false

jobs:
  changes:
    name: Detect whether the dashboard changed
    # Same stacked-PR rule as the suite itself: Netlify only builds deploy previews
    # for PRs into the production branch, so there is nothing to detect elsewhere.
    if: github.event_name != 'pull_request' || github.base_ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    outputs:
      app_changed: ${{ steps.diff.outputs.app_changed }}
      head_touches_app: ${{ steps.diff.outputs.head_touches_app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Both the PR base tip and its head must be present to diff them.
          fetch-depth: 0

      - name: Diff the dashboard, ignoring docs
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_URL_INPUT: ${{ github.event.inputs.base_url }}
        run: |
          set -euo pipefail
          # A manual dispatch names its own URL, so the suite always applies.
          if [ -n "${BASE_URL_INPUT:-}" ]; then
            echo "app_changed=true" >> "$GITHUB_OUTPUT"
            echo "manual dispatch with base_url - running the suite"
            exit 0
          fi
          # If the SHAs are unavailable (e.g. a non-PR event), prefer running the
          # suite over silently skipping the browser check.
          if [ -z "${BASE_SHA:-}" ] || [ -z "${HEAD_SHA:-}" ]; then
            echo "app_changed=true" >> "$GITHUB_OUTPUT"
            echo "no PR base/head SHA available - running the suite"
            exit 0
          fi
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- dashboard-app ':(exclude)dashboard-app/docs'; then
            echo "app_changed=false" >> "$GITHUB_OUTPUT"
            echo "No change under dashboard-app outside docs/."
            echo "Netlify will skip the build for this commit, so there is no preview to smoke."
          else
            echo "app_changed=true" >> "$GITHUB_OUTPUT"
            echo "Dashboard changed - expecting a deploy preview."
          fi
          # Separately: does THIS commit change the app? A PR can touch the app and still
          # end on a commit that does not (a trailing docs or CI commit), and Netlify
          # skips the build for that commit, so no preview can exist for it.
          if git diff --quiet "$HEAD_SHA^" "$HEAD_SHA" -- dashboard-app ':(exclude)dashboard-app/docs' 2>/dev/null; then
            echo "head_touches_app=false" >> "$GITHUB_OUTPUT"
          else
            echo "head_touches_app=true" >> "$GITHUB_OUTPUT"
          fi

  browser-smoke:
    name: Browser smoke against the deploy preview
    needs: changes
    # Skipped (not failed, and not silently green) when the dashboard is untouched.
    if: needs.changes.outputs.app_changed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard-app
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Wait for the Netlify deploy preview on the head SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          BASE_URL_INPUT: ${{ github.event.inputs.base_url }}
          HEAD_TOUCHES_APP: ${{ needs.changes.outputs.head_touches_app }}
        run: |
          set -euo pipefail
          # Manual dispatch may name a URL directly (useful for stacked PRs, which
          # never receive a Netlify deploy preview because Netlify only previews
          # PRs into the production branch).
          if [ -n "${BASE_URL_INPUT:-}" ]; then
            echo "Using supplied base_url: $BASE_URL_INPUT"
            echo "PREVIEW_URL=$BASE_URL_INPUT" >> "$GITHUB_ENV"
            exit 0
          fi
          # CONFIRMED LIVE 2026-11-02: when a deploy changes no ship-able files, Netlify
          # skips the build and reports it as
          #   "Failed during stage 'checking build content for changes':
          #    Canceled build due to no content change"
          #
          # BUT DO NOT PREDICT IT. Measured 2026-11-03: a commit whose own diff touched
          # nothing under dashboard-app still got a BUILD and a working preview, because
          # Netlify compares against ITS OWN cached ref, not this commit's parent. An
          # earlier version of this step failed fast on that prediction and refused to
          # run the suite against a preview that existed - a real coverage loss dressed
          # up as a hard failure, with a message that was simply untrue.
          #
          # So: always look. A commit that changes no app files gets a SHORT budget, and
          # the budget extends as soon as a build is visibly running.
          if [ -z "${SHA:-}" ]; then
            echo "::error::No pull_request head SHA and no base_url input"; exit 1
          fi
          echo "Waiting for netlify/bitxbit-dashboard/deploy-preview success on $SHA"
          echo "This commit touches app files: ${HEAD_TOUCHES_APP:-true}"
          PREVIEW_URL=""
          SAW_PENDING=0
          BUDGET=40
          i=0
          while [ "$i" -lt "$BUDGET" ]; do
            i=$((i + 1))
            statuses=$(curl -sS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/commits/$SHA/statuses")
            state=$(echo "$statuses" | jq -r '[.[] | select(.context=="netlify/bitxbit-dashboard/deploy-preview")][0].state // "none"')
            url=$(echo "$statuses" | jq -r '[.[] | select(.context=="netlify/bitxbit-dashboard/deploy-preview" and .state=="success")][0].target_url // ""')
            echo "tick $i/$BUDGET: state=$state url=${url:-none}"
            if [ -n "$url" ]; then
              # A CANCELED preview is reported as state=success with the ADMIN url
              # ("Deploy Preview canceled." -> app.netlify.com/projects/.../deploys/...).
              # Accepting that made the suite run against the Netlify admin page and
              # fail for a reason that had nothing to do with the code. Only a real
              # preview host is usable.
              case "$url" in
                *"--bitxbit-dashboard.netlify.app"*|*"//bitxbit-dashboard.netlify.app"*)
                  PREVIEW_URL="$url"; break ;;
                *)
                  echo "ignoring non-preview url: $url"
                  url="" ;;
              esac
            fi
            if [ "$state" = "pending" ]; then SAW_PENDING=1; fi
            if [ "$state" = "failure" ] || [ "$state" = "error" ]; then
              # NOTE: Netlify reports a SKIPPED build through this same status as
              # `failure: "Deploy Preview failed."`, so this branch also fires when
              # the build was skipped rather than broken. Check the deploy's
              # `error_message` (content skip vs "account builds usage exceeded")
              # before treating this as a code failure.
              if [ "${HEAD_TOUCHES_APP:-true}" != "true" ]; then
                echo "::error::This commit changes nothing under dashboard-app (outside docs/), and Netlify reported the deploy as failed or skipped for $SHA, so there is no preview to smoke. This is not a code defect. Push a commit that touches dashboard-app, or re-run this workflow manually with an explicit base_url."
              else
                echo "::error::Netlify deploy preview failed or was skipped for $SHA - inspect the deploy's error_message before assuming a code fault"
              fi
              exit 1
            fi
            # Short budget only while nothing is visibly building. Once a build is
            # pending, wait the full window - Netlify decided to build after all.
            if [ "${HEAD_TOUCHES_APP:-true}" != "true" ] && [ "$SAW_PENDING" = "0" ] && [ "$BUDGET" -gt 8 ]; then
              BUDGET=8
              echo "no build pending and this commit changes no app files - shortening the wait to ${BUDGET} ticks"
            fi
            sleep "$TICK_SECONDS"
          done
          if [ -z "$PREVIEW_URL" ]; then
            if [ "${HEAD_TOUCHES_APP:-true}" != "true" ]; then
              echo "::error::No deploy preview appeared for $SHA. This commit changes nothing under dashboard-app (outside docs/), and Netlify did not build it within the shortened window - the suite cannot run against this revision. This is not a code defect. Push a commit that touches dashboard-app, or re-run this workflow manually with an explicit base_url."
            else
              echo "::error::No successful Netlify deploy preview appeared within $(( MAX_TICKS * TICK_SECONDS ))s for $SHA. This is expected when Netlify SKIPPED the build (no ship-able change in the deploy, or the account build quota is exhausted) - it is not proof of a code fault, and it is not a pass either. Re-run with workflow_dispatch and an explicit base_url to exercise the suite."
            fi
            exit 1
          fi
          echo "PREVIEW_URL=$PREVIEW_URL" >> "$GITHUB_ENV"

      - name: Run browser smoke suite
        env:
          E2E_BASE_URL: ${{ env.PREVIEW_URL }}
        run: npx playwright test

      - name: Upload Playwright report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            dashboard-app/playwright-report/
            dashboard-app/test-results/
          if-no-files-found: ignore
          retention-days: 14
