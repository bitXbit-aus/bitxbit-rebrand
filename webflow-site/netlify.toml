[build]
  publish = "."
  command = "echo 'Static site — no build step required'"

  # --- Do not build when nothing on this site changed (do NOT remove) --------
  # WHY: both sites draw on one account-wide build-minute quota. Before this, any
  # commit anywhere in the monorepo — a dashboard security doc, a workflow edit —
  # triggered a marketing build too. On 2026-10-27 that quota was exhausted and
  # deploys silently stopped shipping.
  #
  # EXIT-CODE POLARITY: exit 0 SKIPS the build, non-zero BUILDS it. The command
  # below is therefore "true when nothing in webflow-site/ changed".
  #
  # `git rev-parse --show-toplevel` keeps the pathspec correct regardless of the
  # cwd Netlify uses; the refs-equal guard keeps manual/cleared-cache deploys
  # building instead of being skipped as "no changes".

  ignore = "cd \"$(git rev-parse --show-toplevel)\" && test \"$CACHED_COMMIT_REF\" != \"$COMMIT_REF\" && git diff --quiet \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" -- webflow-site"

[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.images]
  compress = true

# Security headers for all routes
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co https://app.bitxbit.com.au; frame-ancestors 'none';"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Cache static assets
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Redirect old paths (if migrating from previous site structure)
# [[redirects]]
#   from = "/old-page"
#   to = "/how-it-works"
#   status = 301

# Pretty URL fallbacks — Netlify handles this automatically when pretty_urls = true,
# but these explicit redirects ensure compatibility if post-processing is ever disabled.
[[redirects]]
  from = "/how-it-works"
  to = "/how-it-works.html"
  status = 200

[[redirects]]
  from = "/referrals"
  to = "/referrals.html"
  status = 200

[[redirects]]
  from = "/token-economy"
  to = "/token-economy.html"
  status = 200

[[redirects]]
  from = "/ecosystem"
  to = "/ecosystem.html"
  status = 200

[[redirects]]
  from = "/projects"
  to = "/projects.html"
  status = 200

[[redirects]]
  from = "/transparency"
  to = "/transparency.html"
