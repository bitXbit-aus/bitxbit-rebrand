[build]
  command = "rm -rf .next && next build"
  publish = ".next"

  # --- Do not build when nothing ship-able changed (do NOT remove) -----------
  # WHY: the Netlify account shares ONE build-minute quota across both sites, and
  # this repo's security work lands a lot of documentation. The docs live INSIDE
  # the app (dashboard-app/docs/**), so a docs-only merge was a genuine content
  # change to Netlify and burned a full Next build. On 2026-10-27 that quota ran
  # out: the deploy reported "Skipped due to account builds usage exceeded" and a
  # production deploy silently did not ship, while CI stayed green.
  #
  # EXIT-CODE POLARITY — the easy thing to get backwards: Netlify SKIPS the build
  # when this command exits 0, and BUILDS when it exits non-zero. So the command
  # must read "true when there is nothing worth building" (hence `git diff --quiet`,
  # which is 0 exactly when nothing changed).
  #
  # `git rev-parse --show-toplevel` makes the pathspec independent of whichever
  # directory Netlify runs this from (base vs repo root). With a bare `.`, a
  # repo-root cwd would match the whole monorepo, so a docs change here would
  # still look like a change and nothing would be saved.
  #
  # The `test "$CACHED_COMMIT_REF" != "$COMMIT_REF"` guard keeps manual and
  # "clear cache and deploy" builds working: those run with both refs EQUAL, and
  # `git diff` between equal refs reports "no changes" — which would otherwise
  # skip the very deploy that was explicitly requested.

  ignore = "cd \"$(git rev-parse --show-toplevel)\" && test \"$CACHED_COMMIT_REF\" != \"$COMMIT_REF\" && git diff --quiet \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" -- dashboard-app ':(exclude)dashboard-app/docs'"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"
  NEXT_TELEMETRY_DISABLED = "1"

  # --- Skew protection (do NOT remove) ---------------------------------------
  # Fixes a real production incident: a deploy that renamed a page's JS chunk
  # left every browser holding pre-deploy HTML requesting a chunk that Netlify
  # had purged, which 404'd and killed hydration. The page still rendered from
  # server HTML, so it looked fine but NOTHING was clickable — and it produced
  # zero console errors. Measured twice on 2026-10-26: a blank /auth/login, then
  # "no buttons are working" on Safari.
  #
  # With this set, each page load carries a deployment identifier and Next
  # appends it to subsequent asset requests (?dpl=<id>); Netlify's CDN then
  # serves from the MATCHING deployment — current OR previous. Verified:
  # the previously-404ing chunk returns 200 with a valid ?dpl and stays 404 with
  # a bogus one, and WebKit hydrates even when every un-versioned chunk path is
  # dead. See docs/security/evidence/skew-protection-2026-10-26.md.
  #
  # Also set in the Netlify UI for all contexts, so this survives an accidental
  # UI unset and the UI setting survives an accidental edit here. Keep both.
  # Requires no next.config flags: Netlify needs them only below Next 14.1.4,
  # and this app is on 15.5.28. A REDEPLOY is required for a change here to
  # take effect — the adapter wires the identifier up at build time.
  NETLIFY_NEXT_SKEW_PROTECTION = "true"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Redirect root to dashboard (authenticated users will land there; others are handled by middleware)
[[redirects]]
  from = "/"
  to = "/dashboard"
  status = 302
  force = true

# Security headers for all routes
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Content-Security-Policy is deliberately NOT set here. It is emitted once by
    # middleware from lib/csp.ts. This rule used to carry a second copy; two copies that
    # must stay equal drift silently, and a fix applied to one path passes on that path
    # only. lib/csp-policy.test.ts fails if a second definition is reintroduced.
