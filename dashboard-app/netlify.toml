[build]
  command = "rm -rf .next && next build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"
  NEXT_TELEMETRY_DISABLED = "1"

  # --- Skew protection (do NOT remove) ---------------------------------------
  # Fixes a real production incident: a deploy that renamed a page's JS chunk
  # left every browser holding pre-deploy HTML requesting a chunk that Netlify
  # had purged, which 404'd and killed hydration. The page still rendered from
  # server HTML, so it looked fine but NOTHING was clickable — and it produced
  # zero console errors. Measured twice on 2026-10-26: a blank /auth/login, then
  # "no buttons are working" on Safari.
  #
  # With this set, each page load carries a deployment identifier and Next
  # appends it to subsequent asset requests (?dpl=<id>); Netlify's CDN then
  # serves from the MATCHING deployment — current OR previous. Verified:
  # the previously-404ing chunk returns 200 with a valid ?dpl and stays 404 with
  # a bogus one, and WebKit hydrates even when every un-versioned chunk path is
  # dead. See docs/security/evidence/skew-protection-2026-10-26.md.
  #
  # Also set in the Netlify UI for all contexts, so this survives an accidental
  # UI unset and the UI setting survives an accidental edit here. Keep both.
  # Requires no next.config flags: Netlify needs them only below Next 14.1.4,
  # and this app is on 15.5.28. A REDEPLOY is required for a change here to
  # take effect — the adapter wires the identifier up at build time.
  NETLIFY_NEXT_SKEW_PROTECTION = "true"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Redirect root to dashboard (authenticated users will land there; others are handled by middleware)
[[redirects]]
  from = "/"
  to = "/dashboard"
  status = 302
  force = true

# Security headers for all routes
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://plausible.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; frame-src 'self' https://connect.solflare.com https://keys.coinbase.com; connect-src 'self' https://*.supabase.co https://api.mainnet-beta.solana.com https://api.devnet.solana.com https://public-api.birdeye.so https://api.dexscreener.com https://plausible.io; frame-ancestors 'none'; base-uri 'self'; form-action 'self';"
